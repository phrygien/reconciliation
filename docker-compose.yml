networks:
    traefik-public:
        external: true
    central-stock-net:
        external: true

services:
    central-stock-app:
        build: .
        container_name: central-stock-app
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            central-stock-db:
                condition: service_healthy
        volumes:
            - ./storage:/var/www/html/storage
        networks:
            - central-stock-net
            - traefik-public
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.central-stock.rule=Host(`central-stk.kalista-group.fr`)
            - traefik.http.routers.central-stock.entrypoints=websecure
            - traefik.http.routers.central-stock.tls.certresolver=letsencrypt
            - traefik.http.services.central-stock.loadbalancer.server.port=80

    central-stock-db:
        image: mariadb:11
        container_name: central-stock-db
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: ${DB_DATABASE}
            MARIADB_USER: ${DB_USERNAME}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        command: >
            --character-set-server=utf8mb4
            --collation-server=utf8mb4_unicode_ci
            --innodb-buffer-pool-size=2G
            --tmp-table-size=256M
            --max-heap-table-size=256M
            --max-allowed-packet=64M
        volumes:
            - central-stock-db-data:/var/lib/mysql
        networks:
            - central-stock-net
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    central-stock-sftp:
        image: atmoz/sftp:alpine
        container_name: central-stock-sftp
        restart: unless-stopped
        ports:
            - "2222:22"
        command: ${SFTP_USER}:${SFTP_PASSWORD}:82:82
        volumes:
            - ./storage/app/private/depot_winparf/received:/home/${SFTP_USER}/received
            - ./sftp-keys/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
            - ./sftp-keys/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key:ro

volumes:
    central-stock-db-data:
