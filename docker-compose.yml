version: "3.9"

networks:
    traefik-public:
        external: true
    central-stock-net:
        driver: bridge

services:
    central-stock-app:
        build: .
        container_name: central-stock-app
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            central-stock-db:
                condition: service_healthy
        volumes:
            - central-stock-storage:/var/www/html/storage
        networks:
            - central-stock-net
            - traefik-public
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.central-stock.rule=Host(`central-stock.astucom.com`)
            - traefik.http.routers.central-stock.entrypoints=websecure
            - traefik.http.routers.central-stock.tls.certresolver=letsencrypt
            - traefik.http.services.central-stock.loadbalancer.server.port=80

    central-stock-db:
        image: mariadb:11
        container_name: central-stock-db
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: ${DB_DATABASE}
            MARIADB_USER: ${DB_USERNAME}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        volumes:
            - central-stock-db-data:/var/lib/mysql
        networks:
            - central-stock-net
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

volumes:
    central-stock-storage:
    central-stock-db-data:
